# Nginx config for veritascampus.me (microservices)
# Place on VM: /etc/nginx/sites-available/veritascampus-me

server {
    listen 80;
    server_name veritascampus.me www.veritascampus.me;

    root /var/www/veritascampus-me;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# HTTPS: after DNS points to this VM:
# sudo certbot --nginx -d veritascampus.me -d www.veritascampus.me

server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auth_db}
    username: ${DB_USER:sms_user}
    password: ${DB_PASSWORD:sms_pass}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/

jwt:
  secret: ${JWT_SECRET:StudentManagementSystemSecretKeyForJWT2024MustBeLongEnough}
  expiration-ms: 86400000

app:
  registration:
    base-url: ${REGISTRATION_BASE_URL:http://localhost:3000/register}
    code-expiry-days: 7
  security:
    max-failed-login-attempts: 5
    account-lock-minutes: 15
    max-verification-attempts: 8
    verification-lock-minutes: 30

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auth_db}
    username: ${DB_USER:sms_user}
    password: ${DB_PASSWORD:sms_pass}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/

jwt:
  secret: ${JWT_SECRET:StudentManagementSystemSecretKeyForJWT2024MustBeLongEnough}
  expiration-ms: 86400000

app:
  mail:
    from: ${MAIL_FROM:noreply@sms.local}
  registration:
    base-url: ${REGISTRATION_BASE_URL:http://localhost:3000/register}
    code-expiry-days: 7
  password-reset:
    base-url: ${PASSWORD_RESET_BASE_URL:http://localhost:5173/reset-password}
    code-expiry-minutes: 30
  security:
    max-failed-login-attempts: 6
    lockout-warning-after-attempts: 3
    account-lock-minutes: 15
    max-verification-attempts: 8
    verification-lock-minutes: 30

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

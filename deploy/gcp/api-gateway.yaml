apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: sms
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      serviceAccountName: sms-ksa
      containers:
        - name: api-gateway
          image: REGION-docker.pkg.dev/PROJECT_ID/sms-images/api-gateway:latest
          ports:
            - containerPort: 8080
          env:
            - name: EUREKA_HOST
              valueFrom:
                configMapKeyRef:
                  name: sms-common-config
                  key: EUREKA_HOST
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sms-secrets
                  key: jwt-secret
            - name: APP_SECURITY_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: sms-common-config
                  key: ALLOWED_ORIGINS
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: sms-common-config
                  key: SPRING_PROFILES_ACTIVE
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: sms
spec:
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP

# Cloud Build CI/CD pipeline for SMS on GKE
# Trigger on push to main, or run: gcloud builds submit --config=deploy/gcp/cloudbuild.yaml .
#
# Required substitutions (set in trigger or command line):
#   _REGION        e.g. us-central1
#   _AR_REPO       e.g. sms-images
#   _CLUSTER       e.g. sms-gke
#   _CLUSTER_REGION e.g. us-central1

substitutions:
  _REGION: us-central1
  _AR_REPO: sms-images
  _CLUSTER: sms-gke
  _CLUSTER_REGION: us-central1

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  # --- Backend tests ---
  - id: mvn-test
    name: maven:3.9.9-eclipse-temurin-17
    entrypoint: mvn
    args: ["clean", "verify", "-B", "-DskipTests=false"]
    dir: .

  # --- Build and push all microservice images ---
  - id: build-push-images
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE_BASE="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}"
        SERVICES="eureka-server api-gateway auth-service admin-service student-service teacher-service course-service notification-service"
        for SVC in $$SERVICES; do
          echo "Building $$SVC..."
          docker build --build-arg MODULE=$$SVC -t $$IMAGE_BASE/$$SVC:${SHORT_SHA} -t $$IMAGE_BASE/$$SVC:latest .
          docker push $$IMAGE_BASE/$$SVC:${SHORT_SHA}
          docker push $$IMAGE_BASE/$$SVC:latest
        done

  # --- Frontend build ---
  - id: frontend-build
    name: node:20-alpine
    entrypoint: sh
    args:
      - -c
      - |
        cd frontend
        npm ci
        VITE_API_BASE_URL=https://api.yourdomain.com npm run build
    waitFor: ["mvn-test"]

  # --- Deploy to GKE: roll out new images ---
  - id: deploy-gke
    name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        gcloud container clusters get-credentials ${_CLUSTER} --region=${_CLUSTER_REGION}
        IMAGE_BASE="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}"
        SERVICES="eureka-server api-gateway auth-service admin-service student-service teacher-service course-service notification-service"
        for SVC in $$SERVICES; do
          kubectl set image deployment/$$SVC $$SVC=$$IMAGE_BASE/$$SVC:${SHORT_SHA} -n sms --record || true
        done
        kubectl rollout status deployment/api-gateway -n sms --timeout=300s
    waitFor: ["build-push-images"]

images: []

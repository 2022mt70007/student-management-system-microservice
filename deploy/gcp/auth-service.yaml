# Template for auth-service. Copy and adapt for admin, student, teacher, course, notification.
# Requires Kubernetes secret "sms-secrets" (sync from GCP Secret Manager) and Cloud SQL proxy.
apiVersion: v1
kind: Secret
metadata:
  name: sms-secrets
  namespace: sms
type: Opaque
stringData:
  # Prefer External Secrets Operator in production — this is a placeholder for bootstrapping.
  jwt-secret: "REPLACE_WITH_SECRET_MANAGER_VALUE"
  db-password: "REPLACE_WITH_SECRET_MANAGER_VALUE"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: sms
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      serviceAccountName: sms-ksa
      containers:
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.3
          args:
            - "--structured-logs"
            - "--port=5432"
            - "PROJECT_ID:REGION:sms-postgres"
          securityContext:
            runAsNonRoot: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
        - name: auth-service
          image: REGION-docker.pkg.dev/PROJECT_ID/sms-images/auth-service:latest
          ports:
            - containerPort: 8081
          env:
            - name: EUREKA_HOST
              valueFrom:
                configMapKeyRef:
                  name: sms-common-config
                  key: EUREKA_HOST
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: sms-common-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: sms-common-config
                  key: DB_PORT
            - name: DB_NAME
              value: "auth_db"
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: sms-common-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sms-secrets
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: sms-secrets
                  key: jwt-secret
            - name: REGISTRATION_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: sms-common-config
                  key: REGISTRATION_BASE_URL
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: sms-common-config
                  key: SPRING_PROFILES_ACTIVE
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: sms
spec:
  selector:
    app: auth-service
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP
